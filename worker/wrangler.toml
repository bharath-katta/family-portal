# Family Portal — access-log Worker config.
#
# Nothing in this file is secret: PUBLIC_KEY_SPKI can only encrypt, never
# decrypt (the matching private key never leaves your Mac), and
# ALLOWED_GROUPS is just the list of group/section ids that already exist in
# your site — not their labels, not their contents. The real secrets
# (FINGERPRINT_SECRET, EXPORT_TOKEN) are set separately via
# `wrangler secret put` and never appear in this file.
#
# See ~/Documents/family-portal/GUIDE.md for the full one-time setup.

name = "zerostress-log"
main = "log-worker.js"
compatibility_date = "2026-09-12"

[[d1_databases]]
binding = "DB"
database_name = "zerostress-log"
database_id = "1b14b154-4fe6-42a7-9ba8-7498a19723b4"

[vars]
# Paste the public key printed by `./view-log.sh` (first run) here:
PUBLIC_KEY_SPKI = ""

# Paste the output of `node worker/build-allowlist.js` here (run it yourself —
# it reads your local src/config.json, which Claude never touches):
ALLOWED_GROUPS = "{\"primary\":[\"primary-member-0\",\"primary-member-1\",\"primary-member-2\",\"primary-member-3\",\"primary-member-4\",\"primary-member-5\",\"primary-member-6\"],\"secondary\":[\"secondary-member-0\",\"secondary-member-1\"],\"kerala2026\":[\"bookings\",\"flights\",\"itinerary\",\"menu\",\"drinks\",\"videos\"]}"

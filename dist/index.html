<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#FCF9EA" />
  <title>Family Portal</title>
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    :root {
      /* Backgrounds */
      --bg:           #FCF9EA;
      --bg-alt:       #F2EAE0;

      /* Surfaces */
      --surface:      #FFFFFF;
      --surface-alt:  #F8F6F0;

      /* Borders & Shadows */
      --border:       rgba(0,0,0,0.07);
      --border-md:    rgba(0,0,0,0.12);
      --shadow-sm:    0 2px 8px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md:    0 6px 28px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
      --shadow-lg:    0 16px 48px rgba(0,0,0,0.13), 0 4px 14px rgba(0,0,0,0.07);

      /* Text */
      --text:         #2A2535;
      --text-2:       #7B748E;
      --text-3:       #B4AECB;

      /* Radius */
      --r-xl:   24px;
      --r-lg:   18px;
      --r-md:   12px;
      --r-sm:   8px;
      --r-full: 9999px;

      /* Typography — SF Pro + system stack (no external requests) */
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
              "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── GENERIC THEME RAMPS — add a group, add one block here ── */
    [data-theme="blue"] {
      --g-light: #B4D3D9; --g-bg: #EDF5F7; --g-bg2: #D5E9EE;
      --g-border: #B4D3D9; --g-accent: #3A7880;
      --g-btn: #3A7880; --g-btn-hover: #2A6870; --g-text: #1A4850;
      --g-hue: 190;
    }
    [data-theme="coral"] {
      --g-light: #FFA4A4; --g-bg: #FFF0F0; --g-bg2: #FFE2E2;
      --g-border: #FFBDBD; --g-accent: #B85050;
      --g-btn: #B85050; --g-btn-hover: #A04040; --g-text: #7A2020;
      --g-hue: 6;
    }
    [data-theme="teal"] {
      --g-light: #8FCFC2; --g-bg: #EAF7F4; --g-bg2: #CFEFE8;
      --g-border: #8FCFC2; --g-accent: #227A68;
      --g-btn: #227A68; --g-btn-hover: #1A5F52; --g-text: #0F4038;
      --g-hue: 165;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* ── BACKGROUND BLOBS ── */
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(110px); animation: drift 26s ease-in-out infinite; }
    .orb-1 { width: 640px; height: 640px; opacity: 0.38; background: radial-gradient(circle, #B4D3D9 0%, transparent 70%); top: -220px; left: -160px; animation-delay: 0s; }
    .orb-2 { width: 500px; height: 500px; opacity: 0.30; background: radial-gradient(circle, #FFA4A4 0%, transparent 70%); top: -120px; right: -120px; animation-delay: -10s; }
    .orb-3 { width: 420px; height: 420px; opacity: 0.22; background: radial-gradient(circle, #8FCFC2 0%, transparent 70%); bottom: -120px; left: 32%; animation-delay: -19s; }
    @keyframes drift {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(32px,-28px) scale(1.06); }
      66%      { transform: translate(-22px,20px) scale(0.94); }
    }
    @media (prefers-reduced-motion: reduce) {
      .orb, .hero-bg-layer { animation: none !important; transition: none !important; }
    }

    /* ── SCREENS ── */
    .screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; transform: scale(0.97) translateY(8px);
      pointer-events: none;
      transition: opacity 0.30s var(--ease), transform 0.30s var(--ease);
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .screen.active { opacity: 1; transform: scale(1) translateY(0); pointer-events: all; }
    #screen-family, #screen-person { justify-content: flex-start; padding: 0; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-md);
    }

    /* ══════════════════════════════════════
       SCREEN 1 — WELCOME
    ══════════════════════════════════════ */
    #screen-welcome { gap: 48px; }
    .welcome-head { text-align: center; }
    .hello-word {
      font-family: var(--sans);
      font-size: clamp(64px, 14vw, 108px);
      font-weight: 700; font-style: italic;
      letter-spacing: -0.035em; line-height: 1;
      color: var(--text); margin-bottom: 12px;
    }
    .portal-label {
      font-size: clamp(11px, 2vw, 14px); font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-2);
    }

    .group-cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 760px; }

    .group-card {
      flex: 1; min-width: 200px; max-width: 270px;
      padding: 0; border: none; cursor: pointer;
      border-radius: var(--r-xl); overflow: hidden;
      position: relative; text-align: center;
      border: 1.5px solid var(--g-border);
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
      box-shadow: var(--shadow-sm);
    }
    .group-card:hover { transform: translateY(-7px) scale(1.02); box-shadow: var(--shadow-lg); }
    .group-card:active { transform: scale(0.975); }
    .group-card:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

    .gc-hero {
      height: 108px; width: 100%;
      background:
        radial-gradient(120% 140% at 20% 0%, hsla(var(--g-hue),75%,88%,0.9), transparent 60%),
        linear-gradient(150deg, var(--g-bg) 0%, var(--g-bg2) 100%);
    }
    .gc-body { padding: 18px 20px 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: -34px; }
    .gc-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--surface); box-shadow: var(--shadow-md);
      display: flex; align-items: center; justify-content: center;
      color: var(--g-accent); font-size: 26px;
    }
    .gc-icon svg { width: 26px; height: 26px; }
    .gc-name { font-size: 18px; font-weight: 700; color: var(--g-text); }
    .gc-lock { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; color: var(--text-2); }
    .lock-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--g-btn); }

    /* ══════════════════════════════════════
       SCREEN 2 — PASSWORD
    ══════════════════════════════════════ */
    .pw-card { width: 100%; max-width: 390px; padding: 36px 28px; display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
    .pw-back {
      align-self: flex-start; background: none; border: none;
      color: var(--text-2); font-family: var(--sans); font-size: 14px;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      padding: 4px 0; transition: color 0.2s;
    }
    .pw-back:hover { color: var(--text); }
    .pw-back svg { width: 15px; height: 15px; }

    .pw-icon { display: flex; align-items: center; justify-content: center; color: var(--g-accent); }
    .pw-icon svg { width: 44px; height: 44px; }
    .pw-title { font-size: 22px; font-weight: 700; text-align: center; color: var(--text); }
    .pw-hint  { font-size: 13px; color: var(--text-2); text-align: center; }

    .pw-input {
      background: var(--surface-alt); border: 1.5px solid var(--border-md);
      border-radius: var(--r-md); padding: 15px 18px;
      font-size: 18px; font-family: var(--sans); color: var(--text);
      text-align: center; letter-spacing: 0.18em; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s; width: 100%;
    }
    .pw-input::placeholder { letter-spacing: 0; font-size: 13px; color: var(--text-3); }
    .pw-card .pw-input:focus { border-color: var(--g-btn); box-shadow: 0 0 0 3px hsla(var(--g-hue),50%,55%,0.18); }
    .pw-input.shake { animation: shake 0.45s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      22% { transform: translateX(-10px); } 44% { transform: translateX(10px); }
      66% { transform: translateX(-6px); }  88% { transform: translateX(5px); }
    }

    .btn-unlock {
      padding: 15px; border: none; border-radius: var(--r-md);
      font-family: var(--sans); font-size: 15px; font-weight: 700;
      cursor: pointer; color: #FFFFFF;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: 0.01em; min-height: 52px;
      background: var(--g-btn);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-unlock:not(:disabled):hover { background: var(--g-btn-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-unlock:active { transform: scale(0.98); }
    .btn-unlock:disabled { opacity: 0.50; cursor: not-allowed; transform: none; box-shadow: none; }

    .pw-error { font-size: 13px; color: #B03020; text-align: center; min-height: 16px; opacity: 0; transition: opacity 0.2s; }
    .pw-error.show { opacity: 1; }
    .pw-lockout {
      font-size: 13px; color: #8B4A20; background: #FFF4EE; border: 1px solid #F0C8A8;
      border-radius: var(--r-sm); padding: 10px 14px; text-align: center; display: none; line-height: 1.5;
    }
    .pw-lockout.show { display: block; }

    .spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35); border-top-color: #FFFFFF;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══════════════════════════════════════
       SCREEN 3 & 4 — SHARED PAGE / HERO
    ══════════════════════════════════════ */
    .page-inner { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 0 48px; display: flex; flex-direction: column; gap: 14px; position: relative; }

    .hero-bg {
      position: absolute; top: 0; left: 0; right: 0; height: 176px;
      overflow: hidden; border-radius: 0 0 var(--r-xl) var(--r-xl); z-index: 0;
      pointer-events: none;
    }
    .hero-bg-layer {
      position: absolute; top: -30px; left: 0; right: 0; height: 240px;
      background:
        radial-gradient(90% 120% at 15% 10%, hsla(var(--g-hue),75%,85%,0.85), transparent 60%),
        radial-gradient(70% 100% at 85% 90%, hsla(calc(var(--g-hue) + 35),70%,82%,0.6), transparent 65%),
        linear-gradient(160deg, var(--g-bg) 0%, var(--g-bg2) 100%);
    }

    .page-content { position: relative; z-index: 1; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px; }

    .top-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      flex-shrink: 0; position: sticky; top: 16px; z-index: 5;
      box-shadow: var(--shadow-sm);
      margin: 16px 16px 0;
    }
    .tb-family-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g-light); flex-shrink: 0; }
    .tb-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--text); }
    .tb-timer { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; letter-spacing: 0.03em; font-weight: 500; }
    .tb-timer.warn { color: #C07020; } .tb-timer.crit { color: #C02820; }
    .btn-lock {
      background: var(--surface-alt); border: 1px solid var(--border-md); border-radius: var(--r-sm);
      color: var(--text-2); font-family: var(--sans); font-size: 12px; font-weight: 600;
      padding: 6px 12px; cursor: pointer; display: flex; align-items: center; gap: 4px;
      min-height: 32px; transition: background 0.2s, color 0.2s;
    }
    .btn-lock:hover { background: var(--bg-alt); color: var(--text); }

    .hero-title-block { padding: 22px 4px 4px; }
    .h-title { font-size: clamp(24px, 5.5vw, 34px); font-weight: 800; color: var(--text); line-height: 1.1; }
    .h-sub   { font-size: 13px; color: var(--text-2); margin-top: 5px; }

    .section-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3); padding: 0 4px; }

    .members-list { display: flex; flex-direction: column; gap: 10px; }

    .member-btn {
      display: flex; align-items: center; gap: 14px; padding: 14px 18px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
      cursor: pointer; color: var(--text); width: 100%; text-align: left;
      font-family: var(--sans); position: relative; overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.22s var(--ease), border-color 0.22s, box-shadow 0.22s;
    }
    .member-btn::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      border-radius: 3px 0 0 3px; background: var(--g-btn); opacity: 0; transition: opacity 0.22s;
    }
    .member-btn:hover::before { opacity: 1; }
    .member-btn:hover { transform: translateX(4px); box-shadow: var(--shadow-md); border-color: var(--border-md); }
    .member-btn:active { transform: scale(0.99); }
    .member-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

    .avatar {
      flex-shrink: 0; border-radius: 50%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.12); position: relative; z-index: 1;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar.lg { width: 48px; height: 48px; font-size: 15px; }
    .avatar.xl { width: 58px; height: 58px; font-size: 18px; }
    .avatar svg { width: 22px; height: 22px; }
    .avatar.xl svg { width: 26px; height: 26px; }

    .member-info { flex: 1; }
    .member-name { font-size: 16px; font-weight: 700; line-height: 1.2; }
    .member-sub  { font-size: 12px; color: var(--text-2); margin-top: 3px; }

    .chevron { font-size: 20px; color: var(--text-3); font-weight: 300; line-height: 1; transition: transform 0.2s, color 0.2s; }
    .member-btn:hover .chevron { color: var(--g-btn); transform: translateX(3px); }

    /* ══════════════════════════════════════
       SCREEN 4 — ITEMS GRID
    ══════════════════════════════════════ */
    .person-header { display: flex; align-items: center; gap: 14px; padding: 20px 18px; border-radius: var(--r-xl); }
    .btn-back {
      background: var(--surface-alt); border: 1px solid var(--border-md); border-radius: var(--r-sm);
      color: var(--text-2); font-family: var(--sans); font-size: 13px; font-weight: 500;
      padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 4px;
      min-height: 36px; flex-shrink: 0; transition: background 0.2s, color 0.2s;
    }
    .btn-back:hover { background: var(--bg-alt); color: var(--text); }
    .btn-back svg { width: 14px; height: 14px; }

    .person-meta { flex: 1; }
    .person-name { font-size: 22px; font-weight: 700; }
    .person-sub  { font-size: 12px; color: var(--text-2); margin-top: 3px; }

    .docs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .doc-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 20px 14px 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
      cursor: pointer; color: var(--text); text-decoration: none; text-align: center;
      font-family: var(--sans); min-height: 128px; box-shadow: var(--shadow-sm);
      transition: transform 0.22s var(--ease), border-color 0.22s, box-shadow 0.22s;
      position: relative; overflow: hidden;
    }
    .doc-btn:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); text-decoration: none; border-color: var(--g-light); }
    .doc-btn:active { transform: scale(0.97); }
    .doc-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .doc-btn.inactive { opacity: 0.40; cursor: default; pointer-events: none; }
    .doc-btn.err { animation: shake 0.4s ease; }

    .doc-thumb { width: 100%; height: 64px; border-radius: var(--r-sm); object-fit: cover; margin-bottom: 2px; background: var(--surface-alt); }
    .doc-icon { width: 26px; height: 26px; color: var(--g-accent); }
    .doc-icon.emoji { font-size: 26px; line-height: 1; }
    .doc-title { font-size: 13.5px; font-weight: 700; line-height: 1.25; color: var(--text); }
    .doc-desc {
      font-size: 11.5px; color: var(--text-2); line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .doc-na { font-size: 10px; color: var(--text-3); }
    .doc-btn .spinner-dark { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.15); border-top-color: var(--g-accent); border-radius: 50%; animation: spin 0.6s linear infinite; }

    /* ── FILE VIEWER (in-page — avoids window.open/blob-across-tabs issues on mobile Safari) ── */
    .file-viewer {
      position: fixed; inset: 0; z-index: 200; background: rgba(10,10,12,0.94);
      display: flex; flex-direction: column;
    }
    .fv-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; flex-shrink: 0;
    }
    .fv-title { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 600; }
    .fv-close {
      background: rgba(255,255,255,0.14); color: #fff; border: none; border-radius: var(--r-sm);
      font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 8px 14px; cursor: pointer;
    }
    .fv-body { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 0 12px 12px; }
    .fv-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: var(--r-sm); }

    /* ── RESPONSIVE ── */
    @media (max-width: 500px) {
      .group-cards { flex-direction: column; align-items: center; }
      .group-card  { max-width: 340px; width: 100%; }
      .hello-word  { font-size: 60px; }
    }
    @media (max-width: 340px) { .docs-grid { grid-template-columns: 1fr; } }
    @media (min-width: 700px) {
      .page-content { padding: 20px 24px 0; gap: 18px; }
      .docs-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<div class="bg-orbs" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- SCREEN 1 — WELCOME -->
<div id="screen-welcome" class="screen active" role="main" aria-label="Welcome">
  <div class="welcome-head">
    <div class="hello-word">Hello.</div>
    <div class="portal-label">Family Portal</div>
  </div>
  <div class="group-cards" id="group-cards" role="list"></div>
</div>

<!-- SCREEN 2 — PASSWORD -->
<div id="screen-password" class="screen" role="main" aria-label="Enter password">
  <div class="pw-card card" id="pw-card">
    <button class="pw-back" onclick="goWelcome()" aria-label="Back to welcome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Back
    </button>
    <div class="pw-icon" id="pw-icon" aria-hidden="true"></div>
    <div class="pw-title" id="pw-title">—</div>
    <div class="pw-hint">Enter the password to continue</div>
    <input type="password" id="pw-input" class="pw-input" placeholder="Password" autocomplete="off" aria-label="Password" onkeydown="onPwKey(event)" />
    <button class="btn-unlock" id="btn-unlock" onclick="tryUnlock()">Unlock</button>
    <div class="pw-lockout" id="pw-lockout" role="alert" aria-live="assertive"></div>
    <div class="pw-error"   id="pw-error"   role="alert" aria-live="polite"></div>
  </div>
</div>

<!-- SCREEN 3 — SECTION LIST (members or categories) -->
<div id="screen-family" class="screen" role="main" aria-label="Sections">
  <div class="page-inner" id="family-inner">
    <div class="hero-bg"><div class="hero-bg-layer" id="hero-layer-family"></div></div>
    <div class="top-bar">
      <div class="tb-family-dot"></div>
      <span class="tb-name" id="tb-name">—</span>
      <span class="tb-timer" id="tb-timer" aria-label="Session time remaining" aria-live="polite"></span>
      <button class="btn-lock" onclick="doLock()" aria-label="Lock portal">🔒 Lock</button>
    </div>
    <div class="page-content">

// ── ACCESS LOG BEACON ──
// Best-effort only: never blocks or affects the unlock/document flow. Sends
// no title, filename or description — just which section/kind was opened.
// A no-op until the site owner has deployed the logging Worker (LOG_ENDPOINT
// stays empty until then).
function logBeacon(payload) {
  if (!LOG_ENDPOINT) return;
  try {
    const body = JSON.stringify(payload);
    if (navigator.sendBeacon) {
      navigator.sendBeacon(LOG_ENDPOINT, new Blob([body], { type: 'text/plain' }));
    } else {
      fetch(LOG_ENDPOINT, { method: 'POST', body, keepalive: true }).catch(() => {});
    }
  } catch { /* logging must never break the site */ }
}

let activeGroupId = null;
let cache = {};
let activeSection = null;
let sesTimer = null, sesEnd = null, tickTimer = null;
let failCount = 0, lockoutUntil = 0;
const MAX_FAILS = 3;
const LOCKOUT_MS = 30 * 1000;
const SESSION_MS = 5 * 60 * 1000;
const objectUrls = []; // revoked on lock

const NAME_COLORS = ['#6B5EA8','#3A7880','#B85050','#6B5090','#307878','#A05050'];
const AVATAR_BGS  = ['#EAE6F8','#DFF0F3','#FFE8E8','#EDE7F5','#E0F2EF','#FFE8EC'];
const AVATAR_FGS  = NAME_COLORS;

// ── CRYPTO ──
function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function deriveKey(pw, salt) {
  const m = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:600000, hash:'SHA-256' }, m, { name:'AES-GCM', length:256 }, false, ['decrypt']);
}
async function decrypt(encObj, pw) {
  const key = await deriveKey(pw, b64(encObj.salt));
  const raw = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64(encObj.iv) }, key, b64(encObj.data));
  return JSON.parse(new TextDecoder().decode(raw));
}
// Decrypt a document blob using its own embedded raw key (not password-derived).
async function decryptFile(item) {
  // A hard cap so a stalled fetch/decrypt fails visibly instead of leaving
  // the button's spinner stuck forever with no way out.
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch('files/' + item.blob, { signal: controller.signal });
    if (!res.ok) throw new Error('blob fetch failed');
    const ciphertext = await res.arrayBuffer();
    const key = await crypto.subtle.importKey('raw', b64(item.key), 'AES-GCM', false, ['decrypt']);
    const raw = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64(item.iv) }, key, ciphertext);
    return new Blob([raw], { type: item.mime || 'application/octet-stream' });
  } finally {
    clearTimeout(timer);
  }
}

// ── DOM HELPERS ──
function esc(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(String(s))); return d.innerHTML; }
function initials(name) { return name.trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase(); }
function hashHue(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h % 360; }
function iconSvg(name) { return ICON_SVGS[name] || ICON_SVGS.generic || ''; }

function avatarHtml(section, sizeClass, idx) {
  const bg = AVATAR_BGS[idx % AVATAR_BGS.length];
  const fg = AVATAR_FGS[idx % AVATAR_FGS.length];
  if (section.avatar) {
    return `<div class="avatar ${sizeClass}" style="background:${esc(bg)};color:${esc(fg)}"><img src="${esc(section.avatar)}" alt="${esc(section.label)}" /></div>`;
  }
  if (section.icon) {
    return `<div class="avatar ${sizeClass}" style="background:${esc(bg)};color:${esc(fg)}">${iconSvg(section.icon)}</div>`;
  }
  return `<div class="avatar ${sizeClass}" style="background:${esc(bg)};color:${esc(fg)}">${esc(initials(section.label))}</div>`;
}

// ── THEME CONTEXT ──
function applyTheme(theme) {
  document.getElementById('family-inner').dataset.theme = theme;
  document.getElementById('person-inner').dataset.theme = theme;
}

// ── SCREEN TRANSITIONS ──
function showScreen(id) {
  if (id === cur) return;
  document.getElementById('screen-' + cur).classList.remove('active');
  document.getElementById('screen-' + id).classList.add('active');
  cur = id;
  if (id === 'family' || id === 'person') document.getElementById('screen-' + id).scrollTop = 0;
}

// ── WELCOME ──
(function initWelcome() {
  const wrap = document.getElementById('group-cards');
  PCFG.groups.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'group-card';
    btn.dataset.theme = g.theme;
    btn.setAttribute('role', 'listitem');
    btn.setAttribute('aria-label', g.label + ' — enter password');
    btn.innerHTML =
        `<div class="gc-hero"></div>`
      + `<div class="gc-body">`
      +   `<div class="gc-icon">${iconSvg(g.layout === 'people' ? 'home' : 'map')}</div>`
      +   `<div class="gc-name">${esc(g.label)}</div>`
      +   `<div class="gc-lock"><span class="lock-pip"></span>Password protected</div>`
      + `</div>`;
    btn.addEventListener('click', () => selectGroup(g.id));
    wrap.appendChild(btn);
  });
})();
logBeacon({ event: 'page_load' });

function findGroup(id) { return PCFG.groups.find(g => g.id === id); }

// ── GROUP SELECT → PASSWORD ──
function selectGroup(id) {
  activeGroupId = id;
  failCount = 0; lockoutUntil = 0;
  const g = findGroup(id);

  const card = document.getElementById('pw-card');
  card.dataset.theme = g.theme;
  document.getElementById('pw-icon').innerHTML = iconSvg(g.layout === 'people' ? 'home' : 'map');
  document.getElementById('pw-title').textContent = g.label;
  document.getElementById('pw-input').value = '';
  hideLockout(); hideError();
  showScreen('password');
  setTimeout(() => document.getElementById('pw-input').focus(), 360);
}

function goWelcome() { activeGroupId = null; showScreen('welcome'); }
function onPwKey(e) { if (e.key === 'Enter') tryUnlock(); }

function hideError()   { const el = document.getElementById('pw-error');   el.textContent = ''; el.classList.remove('show'); }
function showError(m)  { const el = document.getElementById('pw-error');   el.textContent = m;  el.classList.add('show'); }
function hideLockout() { const el = document.getElementById('pw-lockout'); el.textContent = ''; el.classList.remove('show'); }
function showLockout(m){ const el = document.getElementById('pw-lockout'); el.textContent = m;  el.classList.add('show'); }

// ── UNLOCK ──
async function tryUnlock() {
  const now = Date.now();
  if (now < lockoutUntil) {
    showLockout(`Too many attempts — try again in ${Math.ceil((lockoutUntil - now) / 1000)}s.`);
    return;
  }
  const input = document.getElementById('pw-input');
  const btn = document.getElementById('btn-unlock');
  const pw = input.value;
  if (!pw) return;

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';
  hideError(); hideLockout();

  try {
    const g = findGroup(activeGroupId);
    let groupData;
    try {
      groupData = await decrypt(g, pw);
    } catch {
      logBeacon({ event: 'login_failed', group: activeGroupId });
      failCount++;
      input.classList.add('shake');
      setTimeout(() => input.classList.remove('shake'), 500);
      input.value = '';
      if (failCount >= MAX_FAILS) {
        lockoutUntil = Date.now() + LOCKOUT_MS;
        failCount = 0;
        showLockout('Too many incorrect attempts — locked for 30 seconds.');
        input.focus();
        return;
      }
      const left = MAX_FAILS - failCount;
      showError(`Incorrect password — ${left} attempt${left === 1 ? '' : 's'} remaining.`);
      input.focus();
      return;
    }

    failCount = 0;
    logBeacon({ event: 'login_success', group: activeGroupId });
    cache[activeGroupId] = groupData;
    input.value = '';
    applyTheme(g.theme);
    renderFamilyScreen(groupData);
    startSession();
    showScreen('family');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Unlock';
  }
}

// ── SESSION TIMER ──
const ACTIVITY_EVENTS = ['mousedown','keydown','touchstart','scroll','click'];
function startSession() {
  sesEnd = Date.now() + SESSION_MS;
  clearTimeout(sesTimer); clearInterval(tickTimer);
  sesTimer = setTimeout(doLock, SESSION_MS);
  tickTimer = setInterval(tick, 1000);
  ACTIVITY_EVENTS.forEach(e => window.addEventListener(e, bump, { passive: true }));
}
function bump() { sesEnd = Date.now() + SESSION_MS; clearTimeout(sesTimer); sesTimer = setTimeout(doLock, SESSION_MS); }
function tick() {
  if (!sesEnd) return;
  const rem = Math.max(0, Math.ceil((sesEnd - Date.now()) / 1000));
  const m = Math.floor(rem / 60), s = rem % 60;
  const txt = m + ':' + String(s).padStart(2, '0');
  const cls = rem <= 30 ? 'crit' : rem <= 60 ? 'warn' : '';
  ['tb-timer', 'tb-timer-person'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.textContent = txt; el.className = 'tb-timer ' + cls; }
  });
}
function stopSession() { clearTimeout(sesTimer); clearInterval(tickTimer); sesEnd = null; ACTIVITY_EVENTS.forEach(e => window.removeEventListener(e, bump)); }

function revokeAllObjectUrls() {
  objectUrls.forEach(u => URL.revokeObjectURL(u));
  objectUrls.length = 0;
}

function doLock() {
  stopSession();
  cache = {}; activeSection = null; activeGroupId = null;
  revokeAllObjectUrls();
  closeFileViewer();
  document.getElementById('members-list').innerHTML = '';
  document.getElementById('docs-grid').innerHTML = '';
  showScreen('welcome');
}

// ── SECTION LIST SCREEN (members or categories) ──
function renderFamilyScreen(data) {
  document.getElementById('tb-name').textContent = data.label;
  document.getElementById('tb-name-person').textContent = data.label;
  document.getElementById('family-hero-title').textContent = data.label;
  document.getElementById('family-eyebrow').textContent = data.layout === 'people' ? 'Members' : 'Categories';

  const totalItems = data.sections.reduce((n, s) => n + s.items.length, 0);
  document.getElementById('family-hero-sub').textContent =
    data.layout === 'people'
      ? `${data.sections.length} member${data.sections.length === 1 ? '' : 's'} · ${totalItems} document${totalItems === 1 ? '' : 's'}`
      : `${data.sections.length} categor${data.sections.length === 1 ? 'y' : 'ies'} · ${totalItems} item${totalItems === 1 ? '' : 's'}`;

  const list = document.getElementById('members-list');
  list.innerHTML = '';
  data.sections.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'member-btn';
    btn.setAttribute('role', 'listitem');
    btn.setAttribute('aria-label', `Open ${s.label}`);
    btn.style.transitionDelay = (i * 45) + 'ms';
    btn.innerHTML =
        avatarHtml(s, 'lg', i)
      + `<div class="member-info">`
      +   `<div class="member-name" style="color:${NAME_COLORS[i % NAME_COLORS.length]}">${esc(s.label)}</div>`
      +   `<div class="member-sub">${s.items.length} item${s.items.length === 1 ? '' : 's'}</div>`
      + `</div>`
      + `<div class="chevron" aria-hidden="true">›</div>`;
    btn.addEventListener('click', () => openSection(data, s, i));
    list.appendChild(btn);
  });
}

// ── ITEMS SCREEN ──
function openSection(groupData, section, colorIdx) {
  activeSection = section;
  bump();
  logBeacon({ event: 'section_open', group: activeGroupId, section: section.id });

  const av = document.getElementById('ph-avatar');
  av.style.background = AVATAR_BGS[colorIdx % AVATAR_BGS.length];
  av.style.color = AVATAR_FGS[colorIdx % AVATAR_FGS.length];
  if (section.avatar) {
    av.innerHTML = `<img src="${esc(section.avatar)}" alt="${esc(section.label)}" />`;
  } else if (section.icon) {
    av.innerHTML = iconSvg(section.icon);
  } else {
    av.textContent = initials(section.label);
  }

  document.getElementById('ph-name').textContent = section.label;
  document.getElementById('ph-name').style.color = NAME_COLORS[colorIdx % NAME_COLORS.length];

  const active = section.items.filter(it => it.kind !== 'pending').length;
  document.getElementById('ph-sub').textContent =
    active === section.items.length
      ? `${active} item${active === 1 ? '' : 's'}`
      : `${active} of ${section.items.length} items added`;

  const grid = document.getElementById('docs-grid');
  grid.innerHTML = '';
  section.items.forEach(item => grid.appendChild(renderItemCard(item)));

  showScreen('person');
}

function renderItemCard(item) {
  const iconHtml = ICON_SVGS[item.icon]
    ? `<span class="doc-icon" aria-hidden="true">${iconSvg(item.icon)}</span>`
    : `<span class="doc-icon emoji" aria-hidden="true">${esc(item.icon || '📄')}</span>`;
  const descHtml = item.description ? `<span class="doc-desc">${esc(item.description)}</span>` : '';

  if (item.kind === 'pending') {
    const el = document.createElement('div');
    el.className = 'doc-btn inactive';
    el.setAttribute('role', 'listitem');
    el.setAttribute('aria-label', `${item.title} — not added yet`);
    el.innerHTML = iconHtml + `<span class="doc-title">${esc(item.title)}</span>` + descHtml + `<span class="doc-na">Not added yet</span>`;
    return el;
  }

  if (item.kind === 'link') {
    const el = document.createElement('a');
    el.className = 'doc-btn';
    el.href = item.url; el.target = '_blank'; el.rel = 'noopener noreferrer';
    el.setAttribute('role', 'listitem');
    el.setAttribute('aria-label', `Open ${item.title}`);
    const thumbHtml = item.thumb ? `<img class="doc-thumb" alt="">` : '';
    el.innerHTML = thumbHtml + iconHtml + `<span class="doc-title">${esc(item.title)}</span>` + descHtml;
    if (item.thumb) loadThumb(el, item.thumb);
    el.addEventListener('click', () => logBeacon({ event: 'item_open', group: activeGroupId, section: activeSection && activeSection.id, kind: 'link' }));
    return el;
  }

  // kind === 'file'
  const el = document.createElement('button');
  el.className = 'doc-btn';
  el.type = 'button';
  el.setAttribute('role', 'listitem');
  el.setAttribute('aria-label', `Open ${item.title}`);
  el.innerHTML = iconHtml + `<span class="doc-title">${esc(item.title)}</span>` + descHtml;
  el.addEventListener('click', () => {
    logBeacon({ event: 'item_open', group: activeGroupId, section: activeSection && activeSection.id, kind: 'file' });
    openFileItem(el, item, iconHtml, descHtml);
  });
  return el;
}

async function loadThumb(linkEl, thumb) {
  try {
    const blob = await decryptFile(thumb);
    const url = URL.createObjectURL(blob);
    objectUrls.push(url);
    const img = linkEl.querySelector('img.doc-thumb');
    if (img) img.src = url;
  } catch { /* thumb is decorative — silently skip on failure */ }
}

async function openFileItem(el, item, iconHtml, descHtml) {
  const original = el.innerHTML;
  el.innerHTML = iconHtml + `<span class="doc-title">${esc(item.title)}</span>` + descHtml + `<div class="spinner-dark"></div>`;
  // Only images use the in-page viewer. PDFs download directly instead of
  // rendering in an iframe — Safari's inline blob-PDF rendering is
  // known-flaky, and a direct download is simpler, faster, and reliable
  // everywhere rather than chasing another Safari-only rendering path.
  const isViewable = /^image\//.test(item.mime);
  try {
    const blob = await decryptFile(item);
    const url = URL.createObjectURL(blob);
    objectUrls.push(url);
    if (isViewable) {
      // Rendered in-page, in this same document — a new tab/window needs
      // window.open(), and a Blob URL created here does not reliably resolve
      // once handed to a *different* browsing context (confirmed broken on
      // mobile Safari: the popup opened, but stayed on about:blank because
      // Safari would not load a blob: URL created by the opener). Viewing it
      // inline sidesteps that entirely, and also needs no popup at all.
      openFileViewer(item, url);
    } else {
      const a = document.createElement('a');
      a.href = url; a.download = item.title || 'document';
      document.body.appendChild(a); a.click(); a.remove();
    }
    el.innerHTML = original;
  } catch {
    el.innerHTML = original;
    el.classList.add('err');
    setTimeout(() => el.classList.remove('err'), 500);
  }
}

function openFileViewer(item, url) {
  document.getElementById('fv-title').textContent = item.title || 'Document';
  document.getElementById('fv-body').innerHTML = `<img src="${esc(url)}" alt="${esc(item.title || 'Document')}" />`;
  document.getElementById('file-viewer').hidden = false;
  bump();
}

function closeFileViewer() {
  document.getElementById('file-viewer').hidden = true;
  document.getElementById('fv-body').innerHTML = '';
}

function goFamily() { bump(); showScreen('family'); }

// ── BACK BUTTON TRAP ──
history.pushState(null, '', location.pathname);
window.addEventListener('popstate', () => {
  history.pushState(null, '', location.pathname);
  if (cur === 'person')   { goFamily();  return; }
  if (cur === 'family')   { doLock();    return; }
  if (cur === 'password') { goWelcome(); return; }
});
